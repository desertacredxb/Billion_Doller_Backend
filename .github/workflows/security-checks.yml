name: BDFX backend security checks

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
          cache: npm
      - name: Enforce owner-approved BDFX KYC lock
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          lock=.github/bdfx-kyc-lock.cjs
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git cat-file -e "$BASE_SHA:$lock" 2>/dev/null; then
              git diff --exit-code --name-only "$BASE_SHA" HEAD -- "$lock" .github/CODEOWNERS .github/workflows/security-checks.yml
              git show "$BASE_SHA:$lock" > "$RUNNER_TEMP/bdfx-kyc-lock.cjs"
              lock="$RUNNER_TEMP/bdfx-kyc-lock.cjs"
            fi
          fi
          node "$lock"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm audit --audit-level=moderate
