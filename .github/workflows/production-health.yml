name: BDFX production health

"on":
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-health.yml
      - scripts/productionHealth.js

permissions:
  contents: read

concurrency:
  group: bdfx-production-health
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check public endpoints and maintain one alert issue
        run: node scripts/productionHealth.js
        env:
          GH_TOKEN: ${{ github.token }}
